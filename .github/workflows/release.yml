# Publishes a release when Deniz pushes a signed version tag (v1.0.0). Nothing else starts it: no branch, no pull
# request, no button. It refuses before it builds unless the run is that tag push, the tag names package.json's
# version, the tag is signed and verified by GitHub, the commit is on main, and CHANGELOG.md has the version's section.
#
# npm: trusted publishing over OIDC (Deniz's decision 3a). There is no NPM_TOKEN anywhere, and no --provenance flag:
# npm adds provenance itself for a public package from a public repo. Only the publish job can ask for an OIDC token.
# The first publish (1.0.0-rc.1) is Deniz's, by hand: trusted publishing needs the package to exist already.
# release/DENIZ_CHECKLIST.md has the order and the npmjs.com fields, which must match this file's name, release.yml,
# and the environment, npm.
name: Release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: check, build and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      dist-tag: ${{ steps.tag.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Refuse anything but a version tag push that matches package.json and the CHANGELOG
        id: tag
        run: node release/check-tag.ts
      - name: Refuse a tag that isn't signed and verified by GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A failing gh call stops the step (bash -e), so an API error never reads as an unsigned tag.
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type + " " + .object.sha')
          type=${ref%% *}; sha=${ref#* }
          if [ "$type" != tag ]; then
            echo "::error::Refusing to release: $GITHUB_REF_NAME is a lightweight tag. Push an annotated, signed one (git tag -s)."
            exit 1
          fi
          verification=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '"\(.verification.verified) \(.verification.reason)"')
          if [ "${verification%% *}" != true ]; then
            echo "::error::Refusing to release: GitHub doesn't verify the signature on $GITHUB_REF_NAME (${verification#* })."
            exit 1
          fi
      - name: Refuse a commit that isn't on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Refusing to release: $GITHUB_SHA isn't on main."
            exit 1
          fi
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod
      # prepack cleans dist/ and builds it, so the tarball holds this commit's build and nothing else.
      - name: Pack
        run: |
          mkdir -p out
          npm pack --pack-destination out
      - run: pnpm pack:check
      - name: SHA-256 sums
        working-directory: out
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          sha256sum "skeinwise-$VERSION.tgz" > SHA256SUMS
          cat SHA256SUMS
          mv ../release-notes.md .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: out/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish to npm
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - name: Check the tarball against its sum
        run: sha256sum -c SHA256SUMS
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Refuse an npm too old for trusted publishing (11.5.1)
        run: |
          v=$(npm --version)
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$v" \
            || { echo "::error::npm $v can't publish over OIDC; it needs 11.5.1 or later."; exit 1; }
      - name: Publish
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        run: npm publish "skeinwise-$VERSION.tgz" --tag "$DIST_TAG" --access public

  github-release:
    name: GitHub release
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - name: Release with the tarball and its sums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.dist-tag == 'next' && '--prerelease' || '' }}
        run: |
          gh release create "$GITHUB_REF_NAME" "skeinwise-$VERSION.tgz" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Skeinwise $VERSION" --notes-file release-notes.md $PRERELEASE
